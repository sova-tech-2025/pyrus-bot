[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "UP"]
extend-select = ["FAST001", "FAST002", "FAST003"]
ignore = ["E501", "B008"]
mccabe = { max-complexity = 10 }

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
known-first-party = ["app", "src"]
known-third-party = ["fastapi", "sqlalchemy", "requests"]

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = true
indent-style = "tab"
line-ending = "auto"

[tool.ruff.per-file-ignores]
"tests/**" = ["E501", "T201"]
