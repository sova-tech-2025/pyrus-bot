name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository }}/budget-limit
          docker build -t $IMAGE_NAME:latest .

      - name: Push Docker image
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository }}/budget-limit
          docker push $IMAGE_NAME:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ci/cd
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          script: |
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u simai1 --password-stdin
            IMAGE_NAME=ghcr.io/${{ github.repository }}/budget-limit:latest
            docker pull $IMAGE_NAME
            docker stop budget-limit || true
            docker rm budget-limit || true
            docker run -d \
            --name budget-limit \
            --restart=always \
            -p 8034:8034 \
            -e BOT_SECRET_KEY=${{ secrets.BOT_SECRET_KEY }} \
            -e BOT_LOGIN=${{ secrets.BOT_LOGIN }} \
            -e ACCOUNT_OVERLIMIT_ID=${{ secrets.ACCOUNT_OVERLIMIT_ID }} \
            -e BDR_OVERLIMIT_ID=${{ secrets.BDR_OVERLIMIT_ID }} \
            -e CASH_OVERLIMIT_ID=${{ secrets.CASH_OVERLIMIT_ID }} \
            -e PAYMENT_OVERLIMIT_ID=${{ secrets.PAYMENT_OVERLIMIT_ID }} \
            -e CASH_NEW_OVERLIMIT_ID=${{ secrets.CASH_NEW_OVERLIMIT_ID }} \
            -e PAYMENT_NEW_OVERLIMIT_ID=${{ secrets.PAYMENT_NEW_OVERLIMIT_ID }} \
            $IMAGE_NAME
